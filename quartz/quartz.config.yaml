# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

configuration:
  pageTitle: DSA_Notes
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: true

  analytics:
    provider: plausible

  locale: en-US
  baseUrl: sumitbagate.github.io/WEB-Notes

  ignorePatterns:
    - private
    - templates
    - .obsidian

  # =========================================================
  # GitHub-style Quartz theme
  # =========================================================
  theme:
    fontOrigin: googleFonts
    cdnCaching: true

    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono

    colors:
      # =====================================================
      # GitHub Light
      # =====================================================
      lightMode:
        light: "#ffffff"
        lightgray: "#f6f8fa"
        gray: "#8c959f"
        darkgray: "#656d76"
        dark: "#1f2328"

        # GitHub blue
        secondary: "#0969da"

        # GitHub green
        tertiary: "#1a7f37"

        highlight: "rgba(9, 105, 218, 0.15)"
        textHighlight: "#fff8c5"

      # =====================================================
      # GitHub Dark
      # =====================================================
      darkMode:
        light: "#0d1117"
        lightgray: "#161b22"
        gray: "#8b949e"
        darkgray: "#8b949e"
        dark: "#e6edf3"

        # GitHub blue
        secondary: "#58a6ff"

        # GitHub green
        tertiary: "#3fb950"

        highlight: "rgba(88, 166, 255, 0.15)"
        textHighlight: "#bb800966"


plugins:

  # =========================================================
  # Created / Modified date
  # =========================================================

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10


  # =========================================================
  # GitHub syntax highlighting
  # =========================================================

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20


  # =========================================================
  # Obsidian Markdown
  # =========================================================

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30


  # =========================================================
  # GitHub Flavored Markdown
  # =========================================================

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40


  # =========================================================
  # Table of contents
  # =========================================================

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30


  # =========================================================
  # Crawl links
  # =========================================================

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60


  # =========================================================
  # Description
  # =========================================================

  - source: "@quartz-community/description"
    enabled: true
    order: 70


  # =========================================================
  # LaTeX
  # =========================================================

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80


  # =========================================================
  # Citations
  # =========================================================

  - source: "@quartz-community/citations"
    enabled: false
    order: 85


  # =========================================================
  # Hard line breaks
  # =========================================================

  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90


  # =========================================================
  # Ox Hugo
  # =========================================================

  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91


  # =========================================================
  # Roam
  # =========================================================

  - source: "@quartz-community/roam"
    enabled: false
    order: 92


  # =========================================================
  # Quartz fonts
  # =========================================================

  - source: "@quartz-community/quartz-fonts"
    enabled: true


  # =========================================================
  # External Quartz themes
  #
  # DISABLED because we are using our own GitHub theme above.
  # =========================================================

  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both


  # =========================================================
  # Remove drafts
  # =========================================================

  - source: "@quartz-community/remove-draft"
    enabled: true


  # =========================================================
  # Explicit publish
  # =========================================================

  - source: "@quartz-community/explicit-publish"
    enabled: false


  # =========================================================
  # Unlisted pages
  # =========================================================

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45


  # =========================================================
  # Encrypted pages
  # =========================================================

  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json


  # =========================================================
  # Stacked pages
  # =========================================================

  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all


  # =========================================================
  # Alias redirects
  # =========================================================

  - source: "@quartz-community/alias-redirects"
    enabled: true


  # =========================================================
  # Content index
  # =========================================================

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true


  # =========================================================
  # Favicon
  # =========================================================

  - source: "@quartz-community/favicon"
    enabled: true


  # =========================================================
  # Open Graph image
  # =========================================================

  - source: "@quartz-community/og-image"
    enabled: true


  # =========================================================
  # CNAME
  # =========================================================

  - source: "@quartz-community/cname"
    enabled: true


  # =========================================================
  # Canvas
  # =========================================================

  - source: "@quartz-community/canvas-page"
    enabled: true


  # =========================================================
  # Content page
  # =========================================================

  - source: "@quartz-community/content-page"
    enabled: true


  # =========================================================
  # Folder page
  # =========================================================

  - source: "@quartz-community/folder-page"
    enabled: true


  # =========================================================
  # Tag page
  # =========================================================

  - source: "@quartz-community/tag-page"
    enabled: true


  # =========================================================
  # Explorer
  # =========================================================

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50


  # =========================================================
  # Graph
  # =========================================================

  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10


  # =========================================================
  # Search
  # =========================================================

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true


  # =========================================================
  # Backlinks
  # =========================================================

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50


  # =========================================================
  # Article title
  # =========================================================

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10


  # =========================================================
  # Content metadata
  # =========================================================

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20


  # =========================================================
  # Tag list
  # =========================================================

  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30


  # =========================================================
  # Page title
  # =========================================================

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10


  # =========================================================
  # Dark mode
  # =========================================================

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar


  # =========================================================
  # Reader mode
  # =========================================================

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar


  # =========================================================
  # Breadcrumbs
  # =========================================================

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index


  # =========================================================
  # Comments
  # =========================================================

  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10


  # =========================================================
  # Footer
  # =========================================================

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/SumitBagate
        LinkedIn: https://www.linkedin.com/in/sumit-bagate-97871b296
    layout:
      position: footer
      priority: 50


  # =========================================================
  # Recent notes
  # =========================================================

  - source: "@quartz-community/recent-notes"
    enabled: false


  # =========================================================
  # Mobile spacer
  # =========================================================

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only


  # =========================================================
  # Bases page
  # =========================================================

  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50


  # =========================================================
  # Note properties
  # =========================================================

  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all


  # =========================================================
  # Excalidraw
  # =========================================================

  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50


# ===========================================================
# LAYOUT
# ===========================================================

layout:

  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem

  byPageType:

    "404":
      positions:
        beforeBody: []
        left: []
        right: []

    content: {}

    folder:
      exclude:
        - reader-mode
      positions:
        right: []

    tag:
      exclude:
        - reader-mode
      positions:
        right: []

    canvas: {}

    bases: {}